[package]
name = "ping-me-in-discord"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Send templated Discord webhook notifications from the command line"
repository = "https://github.com/memset0/ping-me-in-discord"
keywords = ["cli", "discord", "notification", "webhook"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "ping_me_in_discord"
path = "src/lib.rs"

[[bin]]
name = "notify-me-on-discord"
path = "src/bin/notify-me-on-discord.rs"

[[bin]]
name = "pingme"
path = "src/bin/pingme.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
fontdb = "0.23"
fontdue = "0.9"
fs2 = "0.4"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jiff = "0.2"
minijinja = "2.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "time"] }
toml = "0.9"
unicode-segmentation = "1.12"
url = "2.5"
whoami = { version = "2.1", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
wiremock = "=0.6.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
