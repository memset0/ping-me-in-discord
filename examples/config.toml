# Copy this file beside ping-me-in-discord and rename it to config.toml.

[discord]
# webhook_url = "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
# Required for channel routing and local, emoji, text, or font-icon avatars.
# bot_token = "YOUR_BOT_TOKEN"
webhook_name = "Notify Me"

[channels]
alerts = "123456789012345678"
releases = "234567890123456789"

[templates]
directory = "templates"

[defaults]
template = "defaults"
# channel = "alerts"
# username = "Ping Me"
# avatar = "letter"
# avatar_url = "https://example.com/avatar.png"
# thread_id = "345678901234567890"
# thread_name = "New thread"
# tts = false

[emoji]
asset_base_url = "https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/72x72/"

[avatars.letter]
description = "General notification avatar"
type = "text"
text = "N"
foreground = "#FFFFFF"
background = "#5865F2"
size = 256
font_size = 150.0

[avatars.rocket]
description = "Use for launches and deployments"
type = "emoji"
emoji = "🚀"
background = "#5865F2"
size = 256
scale = 0.72

[avatars.started]
description = "Agent work started"
type = "emoji"
emoji = "🚀"
background = "#FFFFFF"
size = 256
scale = 0.72

[avatars.progress]
description = "Agent work in progress"
type = "emoji"
emoji = "🔄"
background = "#3B88C3"
size = 256
scale = 0.72

[avatars.success]
description = "Agent work completed successfully"
type = "emoji"
emoji = "✅"
background = "#77B255"
size = 256
scale = 0.72

[avatars.needs-input]
description = "Agent needs user input"
type = "emoji"
emoji = "❓"
background = "#F1C40F"
size = 256
scale = 0.72

[avatars.warning]
description = "Agent warning"
type = "emoji"
emoji = "⚠️"
background = "#E67E22"
size = 256
scale = 0.72

[avatars.error]
description = "Agent work or verification failed"
type = "emoji"
emoji = "❌"
foreground = "#FFFFFF"
background = "#DD2E44"
size = 256
scale = 0.576
