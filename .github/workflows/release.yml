name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${cargo_version}"

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            experimental: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            experimental: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            experimental: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            experimental: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            experimental: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            experimental: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Linux release
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build native release
        if: ${{ ! matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="ping-me-in-discord-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/notify-me-on-discord" stage/
          cp "target/${{ matrix.target }}/release/pingme" stage/
          cp README.md THIRD_PARTY_NOTICES.md stage/
          tar -czf "dist/${archive}" -C stage .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${archive}" > "dist/${archive}.sha256"
          else
            shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"
          fi

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "ping-me-in-discord-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/notify-me-on-discord.exe" stage/
          Copy-Item "target/${{ matrix.target }}/release/pingme.exe" stage/
          Copy-Item README.md, THIRD_PARTY_NOTICES.md stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content "dist/$archive.sha256"

      - name: Upload packaged release
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs:
      - quality
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
